name: Post to Bluesky on new blog post

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**/index.md'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new blog post
        id: detect
        run: |
          NEW_FILE=$(git diff --name-only --diff-filter=A HEAD~1 HEAD | grep 'src/content/blog/.*/index.md' | head -n 1)
          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

      - name: Extract frontmatter
        id: meta
        if: steps.detect.outputs.file != ''
        run: |
          FILE="${{ steps.detect.outputs.file }}"
          TITLE=$(grep '^title:' "$FILE" | head -n 1 | sed 's/title: //' | tr -d '"'"'" )
          SLUG=$(echo "$FILE" | sed 's|src/content/blog/||' | sed 's|/index.md||')
          URL="https://liampallett.github.io/blog/$SLUG"
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post to Bluesky
        if: steps.detect.outputs.file != ''
        run: |
          curl -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
            -H "Content-Type: application/json" \
            -d '{"identifier":"${{ secrets.BLUESKY_HANDLE }}","password":"${{ secrets.BLUESKY_APP_PASSWORD }}"}' \
            -o session.json

          TOKEN=$(cat session.json | python3 -c "import sys,json; print(json.load(sys.stdin)['accessJwt'])")
          DID=$(cat session.json | python3 -c "import sys,json; print(json.load(sys.stdin)['did'])")

          TEXT="New blog post: ${{ steps.meta.outputs.title }} ${{ steps.meta.outputs.url }}"
          URL="${{ steps.meta.outputs.url }}"
          URL_START=$(echo -n "New blog post: ${{ steps.meta.outputs.title }} " | wc -c | tr -d ' ')
          URL_END=$((URL_START + ${#URL}))

          curl -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"$DID\",
              \"collection\": \"app.bsky.feed.post\",
              \"record\": {
                \"\$type\": \"app.bsky.feed.post\",
                \"text\": \"$TEXT\",
                \"facets\": [{
                  \"index\": {\"byteStart\": $URL_START, \"byteEnd\": $URL_END},
                  \"features\": [{\"$type\": \"app.bsky.richtext.facet#link\", \"uri\": \"$URL\"}]
                }],
                \"createdAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }"